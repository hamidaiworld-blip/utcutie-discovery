name: UTCutie Expanded Mastodon Discovery Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expanded-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run expanded Mastodon discovery
        run: |
          python mastodon_expanded_test.py

      - name: Show selected candidates
        run: |
          echo ""
          echo "============================================================"
          echo "UTCUTIE EXPANDED MASTODON SELECTED CANDIDATES"
          echo "============================================================"
          echo ""

          if [ -f mastodon_expanded_selected_candidates.json ]; then
            cat mastodon_expanded_selected_candidates.json
          else
            echo "Selected candidates file was not created."
          fi

      - name: Commit discovery results
        run: |
          git config user.name "UTCutie Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            mastodon_expanded_candidates.json \
            mastodon_expanded_validated.json \
            mastodon_expanded_selected_candidates.json

          git diff --cached --quiet || \
            git commit -m "Update expanded Mastodon discovery results"

          git push
