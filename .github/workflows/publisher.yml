name: UTCutie Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not upload; only show which queue items are due"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: utcutie-repo-state
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check whether a licensed item is due
        id: due
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          queue = json.loads(Path("daily_queue.json").read_text(encoding="utf-8"))
          now = datetime.now(ZoneInfo("Asia/Tehran"))
          due = False
          for item in queue.get("queue", []):
              if item.get("status", "pending") != "pending" or item.get("rights_verified") is not True:
                  continue
              try:
                  scheduled = datetime.fromisoformat(str(item.get("scheduled_at", "")))
              except ValueError:
                  continue
              if scheduled.tzinfo is None:
                  scheduled = scheduled.replace(tzinfo=ZoneInfo("Asia/Tehran"))
              late_minutes = (now - scheduled).total_seconds() / 60
              if 0 <= late_minutes <= 20:
                  due = True
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"has_due={'true' if due else 'false'}\n")
          print("A rights-verified queue item is due." if due else "No rights-verified item is due; skipping FFmpeg install.")
          PY

      - name: Ensure FFmpeg is available
        if: steps.due.outputs.has_due == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Publish due queue items
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_URL: https://x-video-downloader-api.onrender.com/upload-and-send
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python publish_due.py

      - name: Commit successful publications
        run: |
          git config user.name "UTCutie Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily_queue.json history.json
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Record UTCutie publications"
            git pull --rebase origin main
            git push
          fi