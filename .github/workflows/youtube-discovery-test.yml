name: YouTube Discovery Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Show versions
        run: |
          echo "Python:"
          python --version

          echo "yt-dlp:"
          python -m yt_dlp --version

          echo "Deno:"
          deno --version

      - name: Discover YouTube candidates
        run: |
          python - <<'PY'
          import json
          import subprocess

          QUERIES = [
              "funny dog",
              "funny cat",
              "cute puppy",
              "cute kitten",
              "funny pets",
              "wholesome animals",
              "animal friendship",
              "animals being funny",
          ]

          discovered = {}

          for query in QUERIES:
              print()
              print("=" * 70)
              print("SEARCH:", query)
              print("=" * 70)

              command = [
                  "python",
                  "-m",
                  "yt_dlp",
                  "--flat-playlist",
                  "--dump-single-json",
                  "--no-warnings",
                  f"ytsearch15:{query}",
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=120,
                  )

                  if result.returncode != 0:
                      print("SEARCH FAILED")
                      print(result.stderr[-3000:])
                      continue

                  data = json.loads(result.stdout)

                  entries = data.get("entries") or []

                  print("Results:", len(entries))

                  for entry in entries:
                      if not entry:
                          continue

                      video_id = entry.get("id")

                      if not video_id:
                          continue

                      url = (
                          entry.get("webpage_url")
                          or
                          f"https://www.youtube.com/watch?v={video_id}"
                      )

                      discovered[video_id] = {
                          "id": video_id,
                          "url": url,
                          "query": query,
                      }

              except Exception as e:
                  print("SEARCH ERROR:", repr(e))

          print()
          print("=" * 70)
          print("DISCOVERY SUMMARY")
          print("=" * 70)
          print("Unique discovered videos:", len(discovered))

          with open(
              "youtube_discovered_candidates.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  list(discovered.values()),
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Only diagnose the first 5 candidates.
          test_candidates = list(discovered.values())[:5]

          print()
          print("=" * 70)
          print("DIAGNOSTIC EXTRACTION")
          print("=" * 70)
          print("Testing:", len(test_candidates), "videos")

          successful = 0

          for index, candidate in enumerate(
              test_candidates,
              start=1
          ):
              url = candidate["url"]

              print()
              print("-" * 70)
              print(
                  f"TEST {index}/{len(test_candidates)}"
              )
              print("-" * 70)
              print("URL:", url)

              command = [
                  "python",
                  "-m",
                  "yt_dlp",

                  "--no-playlist",

                  "--dump-single-json",

                  "--no-warnings",

                  "--verbose",

                  "--js-runtimes",
                  "deno",

                  url,
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=120,
                  )

                  print()
                  print("RETURN CODE:", result.returncode)

                  print()
                  print("----- STDOUT -----")
                  print(result.stdout[-5000:])

                  print()
                  print("----- STDERR -----")
                  print(result.stderr[-10000:])

                  if result.returncode == 0:
                      successful += 1
                      print()
                      print("RESULT: SUCCESS")
                  else:
                      print()
                      print("RESULT: FAILURE")

              except subprocess.TimeoutExpired:
                  print()
                  print("RESULT: TIMEOUT")

              except Exception as e:
                  print()
                  print(
                      "RESULT: EXCEPTION",
                      repr(e)
                  )

          print()
          print("=" * 70)
          print("DIAGNOSTIC SUMMARY")
          print("=" * 70)
          print(
              "Candidates discovered:",
              len(discovered)
          )
          print(
              "Candidates tested:",
              len(test_candidates)
          )
          print(
              "Successful extractions:",
              successful
          )

          print()
          print("=" * 70)
          print("DIAGNOSTIC COMPLETE")
          print("=" * 70)
          PY

      - name: Upload discovered candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-diagnostic-results
          path: |
            youtube_discovered_candidates.json
          if-no-files-found: ignore
