name: Source Adapter Integration Tests

on:
  pull_request:
    paths:
      - 'source_adapters/**'
      - 'tests/test_source_adapters.py'
      - '.github/workflows/source-adapters-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated adapter contract tests
        run: python -m unittest discover -s tests -p 'test_source_adapters.py' -v
