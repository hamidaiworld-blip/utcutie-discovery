name: UTCutie Daily Queue Preparation

on:
  workflow_dispatch:

  # GitHub Actions cron uses UTC.
  # 10:00 Tehran = 06:30 UTC (Tehran is UTC+03:30 year-round).
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: utcutie-repo-state
  cancel-in-progress: false

jobs:
  prepare-daily-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencv-python-headless==4.10.0.84 numpy

      - name: Determine trigger type and Tehran time
        id: time_check
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tehran = ZoneInfo("Asia/Tehran")
          now = datetime.now(tehran)

          event = os.environ.get("GITHUB_EVENT_NAME", "")

          print("Current Tehran time:")
          print(now.isoformat())

          print("Tehran UTC offset:")
          print(now.utcoffset())

          print("GitHub event:")
          print(event)

          if event == "workflow_dispatch":
              print("Manual run detected.")
              print("Manual runs are allowed at any time.")

          elif now.hour == 10:
              print("Scheduled run is inside the 10:00 Tehran window.")

          else:
              print("Scheduled run is outside the 10:00 Tehran window.")
          PY

          EVENT_NAME="${GITHUB_EVENT_NAME}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: continuing immediately."

          else
            TEHRAN_HOUR=$(TZ=Asia/Tehran date +%H)

            if [ "$TEHRAN_HOUR" = "10" ]; then
              echo "run_now=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run: it is 10:00 Tehran."

            else
              echo "run_now=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled run: not 10:00 Tehran."
            fi
          fi

      - name: Stop if scheduled trigger is not 10 AM Tehran
        if: steps.time_check.outputs.run_now != 'true'
        run: |
          echo "No queue preparation needed at this trigger."
          exit 0

      - name: Run video discovery
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          python mastodon_test.py

      - name: Build daily queue
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo

          SOURCE = Path("selected_candidates.json")
          APPROVALS_FILE = Path("rights_approvals.json")
          OUTPUT = Path("daily_queue.json")

          def normalize_source_url(value):
              value = str(value or "").strip()
              if not value:
                  return ""
              try:
                  parsed = urlsplit(value)
              except ValueError:
                  return ""
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  return ""
              return f"{parsed.scheme.lower()}://{parsed.netloc.lower()}{parsed.path.rstrip('/')}"

          def valid_approval(record):
              if not isinstance(record, dict) or record.get("reuse_allowed") is not True:
                  return False
              basis = str(record.get("rights_basis") or "").strip().casefold()
              allowed = {"cc0", "public domain", "cc by 4.0", "cc by-sa 4.0", "written permission"}
              if basis not in allowed or not str(record.get("attribution") or "").strip():
                  return False
              if basis == "written permission":
                  return bool(str(record.get("permission_reference") or "").strip())
              return bool(normalize_source_url(record.get("license_url")))

          TEHRAN = ZoneInfo("Asia/Tehran")

          now = datetime.now(TEHRAN)
          today = now.date()

          if not SOURCE.exists():
              raise SystemExit(
                  "ERROR: selected_candidates.json was not created."
              )

          with SOURCE.open("r", encoding="utf-8") as f:
              candidates = json.load(f)

          if not isinstance(candidates, list):
              raise SystemExit(
                  "ERROR: selected_candidates.json is not a list."
              )

          # Fail closed: public availability is not a reuse license. Only exact
          # source URLs with an explicit, reviewed rights approval may be queued.
          if APPROVALS_FILE.exists():
              with APPROVALS_FILE.open("r", encoding="utf-8") as f:
                  approval_payload = json.load(f)
          else:
              approval_payload = {"approvals": []}

          approval_by_url = {}
          for record in approval_payload.get("approvals", []):
              if not valid_approval(record):
                  continue
              key = normalize_source_url(record.get("source_url"))
              if key:
                  approval_by_url[key] = record

          approved_candidates = []
          for candidate in candidates:
              source_url = (
                  candidate.get("status_url")
                  or candidate.get("url")
                  or candidate.get("canonical_url")
                  or ""
              )
              approval = approval_by_url.get(normalize_source_url(source_url))
              if not approval:
                  print(
                      "RIGHTS GATE: blocked candidate without verified reuse approval: "
                      + (str(source_url) if source_url else "missing source URL")
                  )
                  continue
              candidate = dict(candidate)
              candidate["source_url"] = source_url
              candidate["rights_verified"] = True
              candidate["rights_basis"] = approval["rights_basis"]
              candidate["license_url"] = str(approval.get("license_url") or "")
              candidate["attribution"] = str(approval.get("attribution") or "").strip()
              candidate["permission_reference"] = str(approval.get("permission_reference") or "").strip()
              approved_candidates.append(candidate)

          candidates = approved_candidates[:20]
          print(f"RIGHTS GATE: {len(candidates)} candidates have verified reuse approval.")

          queue = []
          count = len(candidates)

          if count == 0:
              print("No suitable videos were selected.")

          else:
              # Tehran publishing window:
              # 11:00 → 23:00
              start_time = datetime(
                  today.year,
                  today.month,
                  today.day,
                  11,
                  0,
                  0,
                  tzinfo=TEHRAN,
              )

              end_time = datetime(
                  today.year,
                  today.month,
                  today.day,
                  23,
                  0,
                  0,
                  tzinfo=TEHRAN,
              )

              # Manual rebuilds can happen after 11:00 Tehran. Never create
              # a queue full of already-due posts: start at least 5 minutes
              # from now, while preserving the normal 11:00–23:00 window.
              if now + timedelta(minutes=5) >= end_time:
                  raise SystemExit(
                      "Queue rebuild is too late for today's publishing window. "
                      "Refusing to create a stale same-day queue."
                  )
              start_time = max(start_time, now + timedelta(minutes=5))

              if count == 1:
                  scheduled_times = [start_time]

              else:
                  total_seconds = (
                      end_time - start_time
                  ).total_seconds()

                  interval = total_seconds / (count - 1)

                  scheduled_times = [
                      start_time + timedelta(
                          seconds=interval * i
                      )
                      for i in range(count)
                  ]

              for index, candidate in enumerate(
                  candidates,
                  start=1,
              ):
                  media_url = candidate.get("media_url")

                  if not media_url:
                      print(
                          f"WARNING: Candidate {index} "
                          "has no media_url. Skipping."
                      )
                      continue

                  source_caption = (
                      candidate.get("caption")
                      or candidate.get("clean_caption")
                      or candidate.get("media_description")
                      or ""
                  ).strip()

                  # mastodon_test.py already removes hashtags
                  # and cleans the source caption.
                  attribution = str(candidate.get("attribution") or "").strip()
                  caption_lines = []
                  if source_caption:
                      caption_lines.append(source_caption)
                  if attribution and attribution.casefold() not in source_caption.casefold():
                      caption_lines.append(f"Credit: {attribution}")
                  caption_body = "\n".join(caption_lines).strip()
                  suffix = "\n\n@utcutie"
                  if caption_body:
                      final_caption = caption_body[: 1024 - len(suffix)].rstrip() + suffix
                  else:
                      final_caption = "@utcutie"

                  scheduled_at = scheduled_times[index - 1]

                  queue.append(
                      {
                          "queue_id": index,
                          "scheduled_at": scheduled_at.isoformat(),
                          "status": "pending",
                          "media_url": media_url,
                          "caption": final_caption,
                          "source_url": candidate.get("source_url", ""),
                          "rights_verified": candidate.get("rights_verified") is True,
                          "rights_basis": candidate.get("rights_basis", ""),
                          "license_url": candidate.get("license_url", ""),
                          "attribution": candidate.get("attribution", ""),
                          "permission_reference": candidate.get("permission_reference", ""),
                          "duration": candidate.get(
                              "duration"
                          ),
                          "file_size": candidate.get(
                              "file_size"
                          ),
                          "score": (
                              candidate.get("selection_score")
                              or candidate.get("quality_score")
                              or candidate.get("content_score")
                          ),
                          "instance": candidate.get(
                              "instance"
                          ),
                          "account": candidate.get(
                              "account"
                          ),
                      }
                  )

          payload = {
              "created_at": now.isoformat(),
              "timezone": "Asia/Tehran",
              "timezone_display": "Tehran",
              "target_channel": "@utcutie",

              "max_items": 20,
              "selected_count": len(queue),
              "rights_gate": "Only explicitly approved source URLs with a verified license or written permission can enter the queue.",

              "publishing_window": {
                  "start": "11:00",
                  "end": "23:00",
              },

              "queue": queue,
          }

          with OUTPUT.open("w", encoding="utf-8") as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print()
          print("=" * 70)
          print("UTCUTIE DAILY QUEUE CREATED")
          print("=" * 70)
          print(f"Date: {today.isoformat()}")
          print(f"Created at: {now.isoformat()}")
          print("Timezone: Asia/Tehran")
          print(f"Selected videos: {len(queue)}")
          print("Publishing window: 11:00 → 23:00 Tehran")
          print()

          for item in queue:
              print(
                  f"{item['queue_id']:02d} | "
                  f"{item['scheduled_at']} | "
                  f"{item['duration']} sec | "
                  f"score={item['score']}"
              )

          print()
          print(f"Saved to: {OUTPUT}")
          PY

      - name: Show daily queue
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          echo "================ DAILY QUEUE ================"
          cat daily_queue.json
          echo "============================================="

      - name: Commit daily queue
        if: steps.time_check.outputs.run_now == 'true'
        run: |
          git config user.name "UTCutie Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_queue.json

          if git diff --cached --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "Update daily UTCutie queue"
            git stash push --include-untracked -m "Generated discovery artifacts"
            git pull --rebase origin main
            git push
          fi