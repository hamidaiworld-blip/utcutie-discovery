name: Source Qualification

on:
  workflow_dispatch:
  push:
    paths:
      - "source_leads.json"
      - "source_qualification.py"
      - "tests/test_source_qualification.py"
      - ".github/workflows/source-qualification.yml"

permissions:
  contents: read

concurrency:
  group: utcutie-source-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run qualification tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Generate source qualification report
        run: python source_qualification.py --input source_leads.json --output source_qualification_report.json
      - name: Upload qualification report
        uses: actions/upload-artifact@v4
        with:
          name: source-qualification-report
          path: source_qualification_report.json
          if-no-files-found: error
          retention-days: 30
