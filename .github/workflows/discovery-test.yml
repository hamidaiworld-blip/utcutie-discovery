name: X Discovery Test

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery
        run: |
          python discover.py

      - name: Show candidate file
        run: |
          echo "===== candidate_urls.txt ====="
          if [ -f candidate_urls.txt ]; then
            cat candidate_urls.txt
          else
            echo "candidate_urls.txt was not created"
          fi
