name: X Discovery Test

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Run discovery
        run: |
          python discover.py

      - name: Show candidate URLs
        if: always()
        run: |
          echo "========================================"
          echo "candidate_urls.txt"
          echo "========================================"

          if [ -f candidate_urls.txt ]; then
            cat candidate_urls.txt
          else
            echo "candidate_urls.txt was not created"
          fi
