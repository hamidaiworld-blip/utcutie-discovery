name: X Discovery Test

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp

      - name: Verify yt-dlp
        run: |
          python -m yt_dlp --version

      - name: Run professional validation engine
        run: |
          python discover.py

      - name: Show validation results
        if: always()
        run: |
          echo "========================================"
          echo "VALIDATED CANDIDATES"
          echo "========================================"

          if [ -f validated_candidates.json ]; then
            cat validated_candidates.json
          else
            echo "validated_candidates.json was not created"
          fi

          echo ""
          echo "========================================"
          echo "SELECTED CANDIDATES"
          echo "========================================"

          if [ -f selected_candidates.json ]; then
            cat selected_candidates.json
          else
            echo "selected_candidates.json was not created"
          fi

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: |
            candidate_urls.txt
            validated_candidates.json
            selected_candidates.json
          if-no-files-found: ignore
