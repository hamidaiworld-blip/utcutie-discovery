name: X Discovery Test

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run discovery
        run: |
          python discover.py

      - name: Show discovered URLs
        if: always()
        run: |
          echo "========================================"
          echo "DISCOVERED X POSTS"
          echo "========================================"

          if [ -f candidate_urls.txt ]; then
            cat candidate_urls.txt
          else
            echo "candidate_urls.txt was not created"
          fi

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results
          path: candidate_urls.txt
          if-no-files-found: ignore
