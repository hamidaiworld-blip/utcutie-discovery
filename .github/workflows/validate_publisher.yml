name: UTCutie Publisher Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install requests

      - name: Compile publisher and reference registry
        run: python -m py_compile publish_due.py editorial_source_leads.py mastodon_test.py wikimedia_commons_discovery.py

      - name: Verify FFmpeg availability
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate reference registry without network access
        run: |
          python editorial_source_leads.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("source_leads.json").read_text(encoding="utf-8"))
          assert payload["automated_fetching_enabled"] is False
          assert payload["media_download_enabled"] is False
          assert payload["auto_publish_enabled"] is False
          assert payload["lead_count"] == 0
          assert len(payload["sources"]) == 5
          assert all(source["automated_access"] is False for source in payload["sources"])
          assert all(source["auto_publish_allowed"] is False for source in payload["sources"])
          print("Reference registry safety checks passed.")
          PY

      - name: Verify API-key synchronization fingerprint
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python -c 'import os,hashlib; print("RENDER_API_KEY_SHA256_PREFIX=" + hashlib.sha256(os.environ["RENDER_API_KEY"].encode()).hexdigest()[:16])'

      - name: Safe Render upload endpoint probe
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_URL: https://x-video-downloader-api.onrender.com/upload-and-send
        run: |
          python - <<'PY'
          import io
          import os
          import requests

          response = requests.post(
              os.environ["RENDER_API_URL"],
              headers={"x-api-key": os.environ["RENDER_API_KEY"]},
              data={"caption": "validation probe; this must not publish"},
              files={"video": ("empty.mp4", io.BytesIO(b""), "video/mp4")},
              timeout=180,
          )
          if response.status_code != 422 or "Uploaded video is empty" not in response.text:
              raise SystemExit(f"Unexpected safe-probe response: HTTP {response.status_code} {response.text[:300]}")
          print("Authenticated upload endpoint verified; empty probe was rejected before Telegram send.")
          PY

      - name: Run no-send dry-run safety check
        env:
          DRY_RUN: "true"
        run: python publish_due.py
