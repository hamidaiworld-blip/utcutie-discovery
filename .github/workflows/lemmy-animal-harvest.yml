name: UTCutie Lemmy Animal Harvest

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Harvest Lemmy animal videos
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "UTCUTIE LEMMY MEDIA HARVEST"
          echo "============================================================"

          python <<'PY'
          import json
          import re
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          COMMUNITIES = [
              ("aww", "lemmy.ml"),
              ("aww", "lemmy.world"),
              ("cat", "lemmy.world"),
              ("cats", "midwest.social"),
              ("dogs", "lemmy.world"),
              ("lemmybewholesome", "lemmy.world"),
          ]

          POSTS_PER_COMMUNITY = 50
          MAX_DOWNLOAD_TESTS = 40

          MIN_DURATION = 15
          MAX_DURATION = 180
          MAX_SIZE_MB = 48

          ANIMAL_WORDS = [
              "cat", "cats", "kitten", "kittens",
              "dog", "dogs", "puppy", "puppies",
              "pet", "pets",
              "animal", "animals",
              "rabbit", "bunny", "bunnies",
              "hamster", "guinea pig",
              "bird", "birds",
              "parrot", "parrots",
              "duck", "ducks",
              "goose", "geese",
              "chicken", "chickens",
              "horse", "horses", "foal",
              "cow", "cows", "calf",
              "goat", "goats",
              "sheep",
              "pig", "pigs",
              "fox", "foxes",
              "otter", "otters",
              "seal", "seals",
              "penguin", "penguins",
              "panda", "pandas",
              "koala", "koalas",
              "monkey", "monkeys",
              "squirrel", "squirrels",
              "hedgehog", "hedgehogs",
              "ferret", "ferrets",
              "turtle", "turtles",
              "tortoise",
              "frog", "frogs",
              "lizard", "lizards",
              "snake", "snakes",
          ]

          VIDEO_EXTENSIONS = (
              ".mp4",
              ".webm",
              ".mov",
              ".m4v",
              ".mkv",
              ".ogv",
          )

          IMAGE_EXTENSIONS = (
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
          )

          EXTERNAL_VIDEO_HOSTS = (
              "youtube.com",
              "youtu.be",
              "vimeo.com",
              "tiktok.com",
              "x.com",
              "twitter.com",
              "instagram.com",
              "facebook.com",
              "fb.watch",
          )

          def fetch_json(url, retries=4):
              last_error = None

              for attempt in range(retries):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": (
                                  "Mozilla/5.0 "
                                  "(compatible; UTCutieBot/1.0)"
                              ),
                              "Accept": "application/json",
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30,
                      ) as response:
                          return json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )

                  except Exception as exc:
                      last_error = exc

                      if attempt < retries - 1:
                          time.sleep(
                              2 * (attempt + 1)
                          )

              raise last_error

          def clean_url(url):
              if not url:
                  return None

              url = url.strip()

              if not url.startswith(
                  ("http://", "https://")
              ):
                  return None

              return url

          def extract_urls(text):
              if not text:
                  return []

              pattern = (
                  r'https?://[^\s<>"\']+'
              )

              found = re.findall(
                  pattern,
                  text,
              )

              results = []

              for url in found:
                  url = url.rstrip(
                      ".,);]}>\"'"
                  )

                  url = clean_url(url)

                  if url and url not in results:
                      results.append(url)

              return results

          def url_extension(url):
              try:
                  path = urllib.parse.urlparse(
                      url
                  ).path.lower()

                  return Path(path).suffix

              except Exception:
                  return ""

          def is_direct_video(url):
              return (
                  url_extension(url)
                  in VIDEO_EXTENSIONS
              )

          def is_image(url):
              return (
                  url_extension(url)
                  in IMAGE_EXTENSIONS
              )

          def is_external_video(url):
              if not url:
                  return False

              try:
                  host = urllib.parse.urlparse(
                      url
                  ).netloc.lower()

                  if host.startswith("www."):
                      host = host[4:]

                  return any(
                      host == item
                      or host.endswith(
                          "." + item
                      )
                      for item in EXTERNAL_VIDEO_HOSTS
                  )

              except Exception:
                  return False

          def animal_score(title, body):
              text = (
                  f"{title or ''} "
                  f"{body or ''}"
              ).lower()

              score = 0

              for word in ANIMAL_WORDS:
                  pattern = (
                      r"(?<![a-z])"
                      + re.escape(word)
                      + r"(?![a-z])"
                  )

                  if re.search(
                      pattern,
                      text,
                  ):
                      score += 1

              return score

          def get_duration(path):
              try:
                  result = subprocess.run(
                      [
                          "ffprobe",
                          "-v",
                          "error",
                          "-show_entries",
                          "format=duration",
                          "-of",
                          "default="
                          "noprint_wrappers=1:"
                          "nokey=1",
                          str(path),
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode != 0:
                      return None

                  value = result.stdout.strip()

                  if not value:
                      return None

                  return float(value)

              except Exception:
                  return None

          def download_direct(url, output):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; UTCutieBot/1.0)"
                      ),
                      "Accept": "*/*",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=90,
              ) as response:

                  total = 0

                  with open(
                      output,
                      "wb",
                  ) as file:

                      while True:
                          chunk = response.read(
                              1024 * 1024
                          )

                          if not chunk:
                              break

                          total += len(chunk)

                          if (
                              total
                              > MAX_SIZE_MB
                              * 1024
                              * 1024
                          ):
                              file.close()

                              output.unlink(
                                  missing_ok=True
                              )

                              return (
                                  False,
                                  "file exceeds "
                                  f"{MAX_SIZE_MB} MB",
                              )

                          file.write(chunk)

              if total == 0:
                  output.unlink(
                      missing_ok=True
                  )

                  return (
                      False,
                      "empty file",
                  )

              return (
                  True,
                  "downloaded",
              )

          all_posts = []
          seen_posts = set()

          for community_name, instance in COMMUNITIES:

              print()
              print(
                  "============================================================"
              )
              print(
                  f"COMMUNITY: "
                  f"{community_name}@{instance}"
              )
              print(
                  "============================================================"
              )

              try:

                  community_url = (
                      f"https://{instance}"
                      f"/api/v3/community"
                      f"?name="
                      f"{urllib.parse.quote(community_name)}"
                  )

                  community_data = fetch_json(
                      community_url
                  )

                  community_view = (
                      community_data.get(
                          "community_view"
                      )
                  )

                  if not community_view:
                      print(
                          "COMMUNITY LOOKUP FAILED"
                      )
                      continue

                  community_id = (
                      community_view
                      .get("community", {})
                      .get("id")
                  )

                  print(
                      f"Community ID: "
                      f"{community_id}"
                  )

                  if not community_id:
                      continue

                  posts_url = (
                      f"https://{instance}"
                      f"/api/v3/post/list"
                      f"?community_id={community_id}"
                      f"&type_=All"
                      f"&sort=New"
                      f"&limit={POSTS_PER_COMMUNITY}"
                  )

                  try:
                      data = fetch_json(
                          posts_url
                      )

                  except Exception as first_error:

                      print(
                          "Primary post request "
                          "failed:"
                      )

                      print(
                          f"{type(first_error).__name__}: "
                          f"{first_error}"
                      )

                      print(
                          "Retrying with "
                          "minimal parameters..."
                      )

                      fallback_url = (
                          f"https://{instance}"
                          f"/api/v3/post/list"
                          f"?community_id={community_id}"
                          f"&limit=50"
                      )

                      data = fetch_json(
                          fallback_url
                      )

                  posts = (
                      data.get("posts")
                      or []
                  )

                  print(
                      f"RECENT POSTS: "
                      f"{len(posts)}"
                  )

                  for item in posts:

                      post = item.get(
                          "post"
                      ) or {}

                      counts = item.get(
                          "counts"
                      ) or {}

                      post_id = post.get(
                          "id"
                      )

                      if post_id is None:
                          continue

                      key = (
                          instance,
                          post_id,
                      )

                      if key in seen_posts:
                          continue

                      seen_posts.add(key)

                      title = (
                          post.get("name")
                          or ""
                      )

                      body = (
                          post.get("body")
                          or ""
                      )

                      post_url = clean_url(
                          post.get("url")
                      )

                      urls = []

                      if post_url:
                          urls.append(
                              post_url
                          )

                      for url in extract_urls(
                          body
                      ):
                          if url not in urls:
                              urls.append(
                                  url
                              )

                      relevance = animal_score(
                          title,
                          body
                      )

                      if relevance <= 0:
                          continue

                      all_posts.append({
                          "post_id": post_id,
                          "community": (
                              f"{community_name}"
                              f"@{instance}"
                          ),
                          "title": title,
                          "body": body,
                          "post_url": post_url,
                          "media_urls": urls,
                          "published": post.get(
                              "published"
                          ),
                          "score": counts.get(
                              "score"
                          ),
                          "comments": counts.get(
                              "comments"
                          ),
                          "upvotes": counts.get(
                              "upvotes"
                          ),
                          "downvotes": counts.get(
                              "downvotes"
                          ),
                          "animal_relevance": (
                              relevance
                          ),
                      })

              except Exception as exc:

                  print(
                      f"ERROR: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )

          print()
          print(
              "============================================================"
          )
          print(
              "HARVEST SUMMARY"
          )
          print(
              "============================================================"
          )

          print(
              f"UNIQUE POSTS: "
              f"{len(seen_posts)}"
          )

          print(
              f"ANIMAL POSTS: "
              f"{len(all_posts)}"
          )

          all_posts.sort(
              key=lambda x: (
                  x.get(
                      "animal_relevance",
                      0,
                  ),
                  x.get(
                      "score"
                  ) or 0,
                  x.get(
                      "comments"
                  ) or 0,
              ),
              reverse=True,
          )

          Path(
              "lemmy_animal_posts.json"
          ).write_text(
              json.dumps(
                  all_posts,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          media_candidates = []
          seen_urls = set()

          for post in all_posts:

              for url in post.get(
                  "media_urls",
                  [],
              ):

                  if url in seen_urls:
                      continue

                  seen_urls.add(url)

                  if is_image(url):
                      continue

                  if not (
                      is_direct_video(url)
                      or is_external_video(url)
                  ):
                      continue

                  media_candidates.append({
                      **post,
                      "media_url": url,
                      "media_type": (
                          "direct"
                          if is_direct_video(url)
                          else "external"
                      ),
                  })

          direct = [
              x
              for x in media_candidates
              if x["media_type"] == "direct"
          ]

          external = [
              x
              for x in media_candidates
              if x["media_type"] == "external"
          ]

          print()
          print(
              "MEDIA CANDIDATES: "
              f"{len(media_candidates)}"
          )

          print(
              "DIRECT VIDEO URLS: "
              f"{len(direct)}"
          )

          print(
              "EXTERNAL VIDEO PAGES: "
              f"{len(external)}"
          )

          Path(
              "lemmy_media_candidates.json"
          ).write_text(
              json.dumps(
                  media_candidates,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          successful = []

          test_dir = Path(
              "lemmy_video_test"
          )

          test_dir.mkdir(
              exist_ok=True
          )

          for index, candidate in enumerate(
              media_candidates[
                  :MAX_DOWNLOAD_TESTS
              ],
              start=1,
          ):

              url = candidate[
                  "media_url"
              ]

              print()
              print(
                  f"[{index}/"
                  f"{min(len(media_candidates), MAX_DOWNLOAD_TESTS)}]"
              )

              print(
                  f"TYPE: "
                  f"{candidate['media_type']}"
              )

              print(
                  f"URL: {url}"
              )

              output = (
                  test_dir
                  / f"video_{index}.mp4"
              )

              try:

                  if (
                      candidate["media_type"]
                      == "direct"
                  ):

                      ok, info = (
                          download_direct(
                              url,
                              output,
                          )
                      )

                      if not ok:
                          print(
                              "DIRECT DOWNLOAD: "
                              f"FAIL - {info}"
                          )
                          continue

                  else:

                      output_template = str(
                          test_dir
                          / f"external_{index}.%(ext)s"
                      )

                      command = [
                          "yt-dlp",
                          "--no-playlist",
                          "--no-warnings",
                          "--max-filesize",
                          "48M",
                          "--match-filter",
                          "duration >= 15 & duration <= 180",
                          "-f",
                          "best[ext=mp4]/best",
                          "--merge-output-format",
                          "mp4",
                          "-o",
                          output_template,
                          url,
                      ]

                      result = subprocess.run(
                          command,
                          capture_output=True,
                          text=True,
                          timeout=90,
                      )

                      if result.returncode != 0:

                          print(
                              "YT-DLP: FAIL"
                          )

                          error = (
                              result.stderr
                              or result.stdout
                              or ""
                          ).strip()

                          if error:
                              print(
                                  error[-1000:]
                              )

                          continue

                      files = list(
                          test_dir.glob(
                              f"external_{index}.*"
                          )
                      )

                      if not files:
                          print(
                              "YT-DLP: NO FILE"
                          )
                          continue

                      output = files[0]

                  if not output.exists():
                      print(
                          "DOWNLOAD: NO FILE"
                      )
                      continue

                  size_mb = (
                      output.stat().st_size
                      / 1024
                      / 1024
                  )

                  duration = get_duration(
                      output
                  )

                  print(
                      f"SIZE: "
                      f"{size_mb:.2f} MB"
                  )

                  print(
                      f"DURATION: "
                      f"{duration}"
                  )

                  if duration is None:
                      print(
                          "VALIDATION: "
                          "NO DURATION"
                      )
                      continue

                  if not (
                      MIN_DURATION
                      <= duration
                      <= MAX_DURATION
                  ):
                      print(
                          "VALIDATION: "
                          "DURATION FAIL"
                      )
                      continue

                  if size_mb > MAX_SIZE_MB:
                      print(
                          "VALIDATION: "
                          "SIZE FAIL"
                      )
                      continue

                  print(
                      "VALIDATION: PASS"
                  )

                  successful.append({
                      **candidate,
                      "size_mb": round(
                          size_mb,
                          2,
                      ),
                      "duration": round(
                          duration,
                          2,
                      ),
                  })

              except Exception as exc:

                  print(
                      f"DOWNLOAD ERROR: "
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )

              finally:

                  output.unlink(
                      missing_ok=True
                  )

                  for file in test_dir.glob(
                      f"external_{index}.*"
                  ):
                      file.unlink(
                          missing_ok=True
                      )

          Path(
              "lemmy_successful_videos.json"
          ).write_text(
              json.dumps(
                  successful,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print()
          print(
              "============================================================"
          )
          print(
              "FINAL"
          )
          print(
              "============================================================"
          )

          print(
              f"UNIQUE POSTS: "
              f"{len(seen_posts)}"
          )

          print(
              f"ANIMAL POSTS: "
              f"{len(all_posts)}"
          )

          print(
              f"MEDIA CANDIDATES: "
              f"{len(media_candidates)}"
          )

          print(
              f"DIRECT VIDEO URLS: "
              f"{len(direct)}"
          )

          print(
              f"EXTERNAL VIDEO PAGES: "
              f"{len(external)}"
          )

          print(
              f"VALID VIDEOS: "
              f"{len(successful)}"
          )

          PY

      - name: Upload harvest results
        uses: actions/upload-artifact@v4
        with:
          name: lemmy-animal-harvest
          path: |
            lemmy_animal_posts.json
            lemmy_media_candidates.json
            lemmy_successful_videos.json
          if-no-files-found: warn
