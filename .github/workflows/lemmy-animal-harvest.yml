name: UTCutie Lemmy Animal Harvest

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

      - name: Clone socialfetch
        run: |
          git clone --depth 1 https://github.com/EdgeAIG/socialfetch.git
          cd socialfetch
          chmod +x socialfetch

      - name: Harvest recent Lemmy animal communities
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "UTCUTIE LEMMY DIRECT POST HARVEST"
          echo "============================================================"

          python <<'PY'
          import json
          import re
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          COMMUNITIES = [
              ("aww", "lemmy.ml"),
              ("aww", "lemmy.world"),
              ("cat", "lemmy.world"),
              ("cats", "midwest.social"),
              ("dogs", "lemmy.world"),
              ("lemmybewholesome", "lemmy.world"),
          ]

          POSTS_PER_COMMUNITY = 50
          MAX_DOWNLOAD_TESTS = 30

          ANIMAL_WORDS = [
              "cat", "cats", "kitten", "kittens",
              "dog", "dogs", "puppy", "puppies",
              "pet", "pets",
              "animal", "animals",
              "puppy", "pup",
              "rabbit", "bunny", "bunnies",
              "hamster", "guinea pig",
              "bird", "birds",
              "parrot", "parrots",
              "duck", "ducks",
              "goose", "geese",
              "chicken", "chickens",
              "horse", "horses",
              "foal",
              "cow", "cows",
              "calf",
              "goat", "goats",
              "sheep",
              "pig", "pigs",
              "fox", "foxes",
              "otter", "otters",
              "seal", "seals",
              "penguin", "penguins",
              "panda", "pandas",
              "koala", "koalas",
              "monkey", "monkeys",
              "squirrel", "squirrels",
              "hedgehog", "hedgehogs",
              "ferret", "ferrets",
              "turtle", "turtles",
              "tortoise",
              "frog", "frogs",
              "lizard", "lizards",
              "snake", "snakes",
          ]

          VIDEO_EXTENSIONS = (
              ".mp4",
              ".webm",
              ".mov",
              ".m4v",
              ".mkv",
              ".ogv",
          )

          IMAGE_EXTENSIONS = (
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
          )

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "UTCutieBot/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def clean_url(url):
              if not url:
                  return None

              url = url.strip()

              if not url.startswith(("http://", "https://")):
                  return None

              return url

          def is_video_extension(url):
              path = urllib.parse.urlparse(url).path.lower()
              return path.endswith(VIDEO_EXTENSIONS)

          def is_image_extension(url):
              path = urllib.parse.urlparse(url).path.lower()
              return path.endswith(IMAGE_EXTENSIONS)

          def is_external_video_page(url):
              if not url:
                  return False

              hosts = (
                  "youtube.com",
                  "youtu.be",
                  "vimeo.com",
                  "tiktok.com",
                  "x.com",
                  "twitter.com",
                  "instagram.com",
                  "facebook.com",
                  "fb.watch",
              )

              host = urllib.parse.urlparse(url).netloc.lower()

              if host.startswith("www."):
                  host = host[4:]

              return any(
                  host == h or host.endswith("." + h)
                  for h in hosts
              )

          def animal_relevance(title, body):
              text = f"{title or ''} {body or ''}".lower()

              score = 0

              for word in ANIMAL_WORDS:
                  pattern = r"(?<![a-z])" + re.escape(word) + r"(?![a-z])"

                  if re.search(pattern, text):
                      score += 1

              return score

          all_posts = []
          seen_posts = set()

          for community_name, instance in COMMUNITIES:

              print()
              print("============================================================")
              print(f"COMMUNITY: {community_name}@{instance}")
              print("============================================================")

              try:
                  community_url = (
                      f"https://{instance}/api/v3/community"
                      f"?name={urllib.parse.quote(community_name)}"
                  )

                  community_data = fetch_json(
                      community_url
                  )

                  community_view = community_data.get(
                      "community_view"
                  )

                  if not community_view:
                      print("COMMUNITY LOOKUP FAILED")
                      continue

                  community = community_view.get(
                      "community",
                      {}
                  )

                  community_id = community.get("id")

                  print(
                      f"Community ID: {community_id}"
                  )

                  if not community_id:
                      print("NO COMMUNITY ID")
                      continue

                  posts_url = (
                      f"https://{instance}/api/v3/post/list"
                      f"?community_id={community_id}"
                      f"&type_=All"
                      f"&sort=New"
                      f"&limit={POSTS_PER_COMMUNITY}"
                  )

                  data = fetch_json(posts_url)

                  posts = data.get("posts") or []

                  print(
                      f"RECENT POSTS: {len(posts)}"
                  )

                  for item in posts:

                      post = item.get("post") or {}
                      counts = item.get("counts") or {}

                      post_id = post.get("id")

                      if post_id is None:
                          continue

                      if post_id in seen_posts:
                          continue

                      seen_posts.add(post_id)

                      title = post.get("name") or ""
                      body = post.get("body") or ""
                      url = clean_url(post.get("url"))

                      relevance = animal_relevance(
                          title,
                          body
                      )

                      if relevance <= 0:
                          continue

                      record = {
                          "post_id": post_id,
                          "community": f"{community_name}@{instance}",
                          "title": title,
                          "body": body,
                          "url": url,
                          "published": post.get("published"),
                          "score": counts.get("score"),
                          "comments": counts.get("comments"),
                          "upvotes": counts.get("upvotes"),
                          "downvotes": counts.get("downvotes"),
                          "animal_relevance": relevance,
                      }

                      all_posts.append(record)

              except Exception as exc:
                  print(
                      f"ERROR: {type(exc).__name__}: {exc}"
                  )

          print()
          print("============================================================")
          print("HARVEST SUMMARY")
          print("============================================================")

          print(
              f"UNIQUE POSTS: {len(seen_posts)}"
          )

          print(
              f"ANIMAL POSTS: {len(all_posts)}"
          )

          all_posts.sort(
              key=lambda x: (
                  x.get("animal_relevance", 0),
                  x.get("score") or 0,
                  x.get("comments") or 0,
              ),
              reverse=True
          )

          Path(
              "lemmy_animal_posts.json"
          ).write_text(
              json.dumps(
                  all_posts,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          direct_videos = []
          external_pages = []

          seen_urls = set()

          for post in all_posts:

              url = post.get("url")

              if not url:
                  continue

              if url in seen_urls:
                  continue

              seen_urls.add(url)

              if is_video_extension(url):
                  direct_videos.append(post)

              elif is_image_extension(url):
                  continue

              elif is_external_video_page(url):
                  external_pages.append(post)

          print(
              f"DIRECT VIDEO URLS: {len(direct_videos)}"
          )

          print(
              f"EXTERNAL VIDEO PAGES: {len(external_pages)}"
          )

          Path(
              "lemmy_direct_videos.json"
          ).write_text(
              json.dumps(
                  direct_videos,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path(
              "lemmy_external_video_pages.json"
          ).write_text(
              json.dumps(
                  external_pages,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print()
          print("============================================================")
          print("DIRECT VIDEO DOWNLOAD TEST")
          print("============================================================")

          successful = []

          candidates = (
              direct_videos +
              external_pages
          )

          for index, post in enumerate(
              candidates[:MAX_DOWNLOAD_TESTS],
              start=1
          ):

              url = post.get("url")

              print()
              print(
                  f"[{index}/{min(len(candidates), MAX_DOWNLOAD_TESTS)}]"
              )

              print(
                  f"URL: {url}"
              )

              output_dir = Path(
                  "lemmy_video_test"
              )

              output_dir.mkdir(
                  exist_ok=True
              )

              output_template = str(
                  output_dir / "%(id)s.%(ext)s"
              )

              command = [
                  "yt-dlp",
                  "--no-playlist",
                  "--no-warnings",
                  "--max-filesize",
                  "48M",
                  "--match-filter",
                  "duration >= 15 & duration <= 180",
                  "-f",
                  "best[ext=mp4]/best",
                  "--merge-output-format",
                  "mp4",
                  "-o",
                  output_template,
                  url,
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=90
                  )

                  if result.returncode != 0:
                      print("YT-DLP: FAIL")

                      stderr = (
                          result.stderr or ""
                      ).strip()

                      if stderr:
                          print(
                              stderr[-1000:]
                          )

                      continue

                  files = list(
                      output_dir.glob("*")
                  )

                  if not files:
                      print(
                          "YT-DLP: NO FILE"
                      )
                      continue

                  video = files[0]

                  size_mb = (
                      video.stat().st_size
                      / 1024
                      / 1024
                  )

                  print(
                      f"YT-DLP: SUCCESS "
                      f"{size_mb:.2f} MB"
                  )

                  successful.append({
                      **post,
                      "downloaded_file": str(video),
                      "size_mb": round(
                          size_mb,
                          2
                      ),
                  })

                  video.unlink(
                      missing_ok=True
                  )

              except subprocess.TimeoutExpired:
                  print(
                      "YT-DLP: TIMEOUT"
                  )

          Path(
              "lemmy_successful_videos.json"
          ).write_text(
              json.dumps(
                  successful,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print()
          print("============================================================")
          print("FINAL")
          print("============================================================")

          print(
              f"RAW/UNIQUE POSTS: {len(seen_posts)}"
          )

          print(
              f"ANIMAL CANDIDATES: {len(all_posts)}"
          )

          print(
              f"DIRECT VIDEO URLS: {len(direct_videos)}"
          )

          print(
              f"EXTERNAL VIDEO PAGES: {len(external_pages)}"
          )

          print(
              f"YT-DLP SUCCESS: {len(successful)}"
          )

          print()
          print(
              "Files generated:"
          )

          print(
              "  lemmy_animal_posts.json"
          )

          print(
              "  lemmy_direct_videos.json"
          )

          print(
              "  lemmy_external_video_pages.json"
          )

          print(
              "  lemmy_successful_videos.json"
          )

          PY

      - name: Upload harvest results
        uses: actions/upload-artifact@v4
        with:
          name: lemmy-animal-harvest
          path: |
            lemmy_animal_posts.json
            lemmy_direct_videos.json
            lemmy_external_video_pages.json
            lemmy_successful_videos.json
          if-no-files-found: warn
