name: UTCutie Targeted Lemmy Animal Harvest

on:
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp

          git clone --depth 1 https://github.com/EdgeAIG/socialfetch.git

          cd socialfetch
          chmod +x socialfetch

      - name: Harvest animal communities
        run: |
          cd socialfetch

          echo "============================================================"
          echo "UTCUTIE TARGETED ANIMAL COMMUNITY HARVEST"
          echo "============================================================"

          communities=(
            "aww@lemmy.ml"
            "aww@lemmy.world"
            "cat@lemmy.world"
            "cats@midwest.social"
            "dogs@lemmy.world"
            "lemmybewholesome@lemmy.world"
          )

          for community in "${communities[@]}"; do
            echo ""
            echo "============================================================"
            echo "COMMUNITY: $community"
            echo "============================================================"

            ./socialfetch lemmy community "$community" \
              --limit 30 \
              --json || true

            sleep 2
          done

      - name: Extract candidate media URLs
        run: |
          cd socialfetch

          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          communities = [
              "aww@lemmy.ml",
              "aww@lemmy.world",
              "cat@lemmy.world",
              "cats@midwest.social",
              "dogs@lemmy.world",
              "lemmybewholesome@lemmy.world",
          ]

          all_posts = []

          def run_fetch(community):
              try:
                  result = subprocess.run(
                      [
                          "./socialfetch",
                          "lemmy",
                          "community",
                          community,
                          "--limit",
                          "30",
                          "--json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=45,
                  )

                  if result.returncode != 0:
                      print(
                          f"FETCH FAILED: {community}"
                      )
                      print(
                          result.stderr[-500:]
                      )
                      return []

                  data = json.loads(result.stdout)
                  payload = data.get("data")

                  if isinstance(payload, dict):
                      posts = (
                          payload.get("posts")
                          or payload.get("items")
                          or []
                      )
                  elif isinstance(payload, list):
                      posts = payload
                  else:
                      posts = []

                  return posts

              except Exception as e:
                  print(
                      f"ERROR fetching {community}: {e}"
                  )
                  return []

          for community in communities:
              posts = run_fetch(community)

              print(
                  f"{community}: "
                  f"{len(posts)} posts"
              )

              for post in posts:
                  if isinstance(post, dict):
                      post["_source_community"] = community
                      all_posts.append(post)

          print()
          print(
              "TOTAL RAW POSTS:",
              len(all_posts)
          )

          # ----------------------------------------------------------
          # Deduplicate posts
          # ----------------------------------------------------------

          unique = {}
          url_pattern = re.compile(
              r'https?://[^\s"\'<>]+'
          )

          def collect_urls(value):
              urls = set()

              if isinstance(value, str):
                  for match in url_pattern.findall(value):
                      urls.add(
                          match.rstrip(
                              ".,;:!?)]}"
                          )
                      )

              elif isinstance(value, dict):
                  for value2 in value.values():
                      urls.update(
                          collect_urls(value2)
                      )

              elif isinstance(value, list):
                  for value2 in value:
                      urls.update(
                          collect_urls(value2)
                      )

              return urls

          for post in all_posts:
              post_id = (
                  str(post.get("id"))
                  if post.get("id") is not None
                  else None
              )

              post_url = (
                  post.get("ap_id")
                  or post.get("url")
                  or post.get("post_url")
              )

              key = post_id or post_url

              if key:
                  unique[key] = post

          posts = list(unique.values())

          print(
              "UNIQUE POSTS:",
              len(posts)
          )

          # ----------------------------------------------------------
          # Animal relevance
          # ----------------------------------------------------------

          animal_terms = [
              "dog",
              "dogs",
              "puppy",
              "puppies",
              "cat",
              "cats",
              "kitten",
              "kittens",
              "pet",
              "pets",
              "animal",
              "animals",
              "puppo",
              "doggo",
              "kitty",
              "kitties",
              "سگ",
              "گربه",
              "توله",
              "حیوان",
              "حیوانات",
          ]

          def get_text(post):
              parts = []

              for key in (
                  "name",
                  "title",
                  "body",
                  "content",
                  "description",
              ):
                  value = post.get(key)

                  if isinstance(value, str):
                      parts.append(value)

              return " ".join(parts)

          # ----------------------------------------------------------
          # Classify URLs
          # ----------------------------------------------------------

          direct_video_extensions = (
              ".mp4",
              ".webm",
              ".mov",
              ".m4v",
              ".mkv",
              ".ogv",
          )

          image_extensions = (
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
          )

          video_hosts = (
              "v.redd.it",
              "video.twimg.com",
              ".mp4",
              ".webm",
              ".mov",
          )

          candidates = []

          for post in posts:

              text = get_text(post)
              lower_text = text.lower()

              animal_matches = [
                  term
                  for term in animal_terms
                  if term.lower() in lower_text
              ]

              urls = collect_urls(post)

              direct_videos = []
              images = []
              external_video_pages = []

              for url in urls:
                  lower = url.lower()

                  if any(
                      lower.split("?")[0].endswith(ext)
                      for ext in direct_video_extensions
                  ):
                      direct_videos.append(url)

                  elif any(
                      lower.split("?")[0].endswith(ext)
                      for ext in image_extensions
                  ):
                      images.append(url)

                  elif any(
                      host in lower
                      for host in (
                          "youtube.com",
                          "youtu.be",
                          "vimeo.com",
                          "tiktok.com",
                          "x.com",
                          "twitter.com",
                          "reddit.com",
                          "instagram.com",
                      )
                  ):
                      external_video_pages.append(url)

              # Search for media objects explicitly present in
              # the Lemmy response.
              media_candidates = []

              def scan_media(value):
                  if isinstance(value, dict):
                      for key, val in value.items():
                          key_lower = str(key).lower()

                          if (
                              "video" in key_lower
                              or "media" in key_lower
                              or "thumbnail" in key_lower
                          ):
                              if isinstance(val, str):
                                  media_candidates.append(val)

                          scan_media(val)

                  elif isinstance(value, list):
                      for item in value:
                          scan_media(item)

              scan_media(post)

              for media in media_candidates:
                  if (
                      isinstance(media, str)
                      and media.startswith("http")
                  ):
                      if media not in direct_videos:
                          direct_videos.append(media)

              if not animal_matches:
                  continue

              candidates.append(
                  {
                      "community": post.get(
                          "_source_community"
                      ),
                      "id": post.get("id"),
                      "title": (
                          post.get("name")
                          or post.get("title")
                          or ""
                      ),
                      "body": (
                          post.get("body")
                          or post.get("content")
                          or ""
                      ),
                      "post_url": (
                          post.get("ap_id")
                          or post.get("url")
                          or ""
                      ),
                      "animal_matches": animal_matches,
                      "direct_videos": list(
                          dict.fromkeys(
                              direct_videos
                          )
                      ),
                      "images": list(
                          dict.fromkeys(
                              images
                          )
                      ),
                      "external_video_pages": list(
                          dict.fromkeys(
                              external_video_pages
                          )
                      ),
                  }
              )

          # ----------------------------------------------------------
          # Report
          # ----------------------------------------------------------

          print()
          print(
              "============================================================"
          )
          print(
              "ANIMAL CANDIDATES"
          )
          print(
              "============================================================"
          )

          print(
              "Animal candidates:",
              len(candidates)
          )

          direct_video_count = 0
          external_video_count = 0

          for index, item in enumerate(
              candidates,
              1
          ):
              direct_video_count += len(
                  item["direct_videos"]
              )

              external_video_count += len(
                  item["external_video_pages"]
              )

              print()
              print(
                  f"{index:03d}. "
                  f"{item['title'][:150]}"
              )

              print(
                  "Community:",
                  item["community"]
              )

              print(
                  "Animals:",
                  item["animal_matches"]
              )

              print(
                  "Post:",
                  item["post_url"]
              )

              print(
                  "Direct video:",
                  len(item["direct_videos"])
              )

              for url in item["direct_videos"]:
                  print(
                      "  VIDEO:",
                      url
                  )

              print(
                  "External video pages:",
                  len(
                      item[
                          "external_video_pages"
                      ]
                  )
              )

              for url in item[
                  "external_video_pages"
              ][:5]:
                  print(
                      "  EXTERNAL:",
                      url
                  )

          print()
          print(
              "DIRECT VIDEO URLS:",
              direct_video_count
          )

          print(
              "EXTERNAL VIDEO PAGES:",
              external_video_count
          )

          # ----------------------------------------------------------
          # Test direct videos with yt-dlp
          # ----------------------------------------------------------

          direct_urls = []

          for item in candidates:
              for url in item["direct_videos"]:
                  if url not in direct_urls:
                      direct_urls.append(url)

          print()
          print(
              "============================================================"
          )
          print(
              "DIRECT VIDEO DOWNLOAD TEST"
          )
          print(
              "============================================================"
          )

          successful = []

          for index, url in enumerate(
              direct_urls[:15],
              1
          ):
              print()
              print(
                  f"TEST {index}/{min(15, len(direct_urls))}"
              )

              print(
                  url
              )

              try:
                  result = subprocess.run(
                      [
                          "yt-dlp",
                          "--dump-single-json",
                          "--skip-download",
                          "--no-warnings",
                          url,
                      ],
                      capture_output=True,
                      text=True,
                      timeout=45,
                  )

                  if result.returncode == 0:
                      try:
                          info = json.loads(
                              result.stdout
                          )

                          print(
                              "RESULT: SUCCESS"
                          )

                          print(
                              "TITLE:",
                              info.get(
                                  "title"
                              )
                          )

                          print(
                              "DURATION:",
                              info.get(
                                  "duration"
                              )
                          )

                          successful.append(
                              {
                                  "url": url,
                                  "title": info.get(
                                      "title"
                                  ),
                                  "duration": info.get(
                                      "duration"
                                  ),
                              }
                          )

                      except Exception:
                          print(
                              "RESULT: JSON ERROR"
                          )

                  else:
                      print(
                          "RESULT: FAIL"
                      )

                      print(
                          (
                              result.stderr
                              or result.stdout
                          )[-1000:]
                      )

              except subprocess.TimeoutExpired:
                  print(
                      "RESULT: TIMEOUT"
                  )

          # ----------------------------------------------------------
          # Save results
          # ----------------------------------------------------------

          with open(
              "../lemmy_animal_candidates.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  candidates,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "../lemmy_successful_videos.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  successful,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "============================================================"
          )
          print(
              "FINAL"
          )
          print(
              "============================================================"
          )

          print(
              "RAW POSTS:",
              len(all_posts)
          )

          print(
              "UNIQUE POSTS:",
              len(posts)
          )

          print(
              "ANIMAL CANDIDATES:",
              len(candidates)
          )

          print(
              "DIRECT VIDEO URLS:",
              len(direct_urls)
          )

          print(
              "YT-DLP SUCCESS:",
              len(successful)
          )
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemmy-animal-harvest-results
          path: |
            lemmy_animal_candidates.json
            lemmy_successful_videos.json
          if-no-files-found: ignore
