name: UTCutie Mastodon Video Discovery Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup publication history
        run: |
          cp history.json history_before_test.json

      - name: Reset temporary discovery history
        run: |
          echo "[]" > history.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Mastodon discovery
        run: python mastodon_test.py

      - name: Restore publication history
        run: |
          cp history_before_test.json history.json

      - name: Send ONE test video to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests

          RENDER_URL = (
              "https://x-video-downloader-api.onrender.com"
              "/send-media-and-send"
          )

          API_KEY = os.environ["RENDER_API_KEY"]

          with open(
              "selected_candidates.json",
              "r",
              encoding="utf-8"
          ) as f:
              candidates = json.load(f)

          print(
              f"Selected candidates: {len(candidates)}"
          )

          if not candidates:
              print("No candidates found.")
              sys.exit(1)

          candidate = candidates[0]

          media_url = candidate.get(
              "media_url"
          )

          caption = candidate.get(
              "caption",
              ""
          ).strip()

          if not media_url:
              print(
                  "First candidate has no media_url."
              )
              sys.exit(1)

          if caption:
              final_caption = (
                  caption
                  + "\n\n"
                  + "@utcutie"
              )
          else:
              final_caption = "@utcutie"

          print("")
          print("=" * 70)
          print("AUTOMATED END-TO-END TEST")
          print("=" * 70)
          print(
              f"Media URL: {media_url}"
          )
          print(
              f"Duration: {candidate.get('duration')}"
          )
          print(
              f"File size: {candidate.get('file_size')}"
          )
          print(
              f"Caption: {final_caption}"
          )
          print("")
          print("Sending to Render...")

          try:

              response = requests.get(
                  RENDER_URL,
                  params={
                      "media_url": media_url,
                      "caption": final_caption
                  },
                  headers={
                      "x-api-key": API_KEY
                  },
                  timeout=360
              )

          except Exception as exc:

              print(
                  f"Request failed: {exc}"
              )
              sys.exit(1)

          print(
              f"HTTP status: {response.status_code}"
          )

          print(
              f"Render response: {response.text}"
          )

          if not response.ok:
              print(
                  "END-TO-END TEST FAILED."
              )
              sys.exit(1)

          try:
              result = response.json()
          except Exception:
              print(
                  "Render returned invalid JSON."
              )
              sys.exit(1)

          if not result.get(
              "telegram_sent"
          ):
              print(
                  "Telegram upload was not confirmed."
              )
              sys.exit(1)

          message_id = result.get(
              "telegram_message_id"
          )

          print("")
          print("=" * 70)
          print("END-TO-END TEST SUCCESS")
          print("=" * 70)
          print(
              f"Telegram message ID: {message_id}"
          )
          print(
              f"Duration: {result.get('duration')}"
          )
          print(
              f"File size: {result.get('file_size')}"
          )

          history_path = "history.json"

          with open(
              history_path,
              "r",
              encoding="utf-8"
          ) as f:
              history = json.load(f)

          if not isinstance(history, list):
              history = []

          history.append({
              "published_at": (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              ),
              "telegram_message_id": message_id,
              "sha256": candidate.get(
                  "sha256"
              ),
              "media_url": media_url,
              "status_url": candidate.get(
                  "status_url"
              ),
              "duration": candidate.get(
                  "duration"
              ),
              "file_size": candidate.get(
                  "file_size"
              ),
              "total_score": candidate.get(
                  "total_score"
              )
          })

          with open(
              history_path,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "Successful publication recorded "
              "in history.json."
          )

          PY

      - name: Save test results
        run: |
          rm -f history_before_test.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json \
                  mastodon_candidates.json \
                  validated_candidates.json \
                  selected_candidates.json

          git diff --cached --quiet || git commit -m "Record UTCutie end-to-end test publication"

          git push
