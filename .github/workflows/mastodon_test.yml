name: UTCutie Mastodon Video Discovery Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-and-test:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4




      # --------------------------------------------------
      # 2. Install Python dependencies
      # --------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencv-python-headless numpy


      # --------------------------------------------------
      # 3. Create isolated test history
      #
      # The REAL history.json is backed up.
      # Discovery sees an empty history for this test only.
      # --------------------------------------------------

      - name: Prepare isolated test history
        run: |
          cp history.json history.test.backup.json

          printf '[]\n' > history.json

          echo "Real publication history backed up."
          echo "Temporary test history created."


      # --------------------------------------------------
      # 4. Run discovery
      # --------------------------------------------------

      - name: Run Mastodon discovery
        run: |
          python mastodon_test.py


      # --------------------------------------------------
      # 5. Send first selected video to Render
      #
      # The real history is restored regardless of success
      # or failure.
      # --------------------------------------------------

      - name: Send first selected video to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import sys
          from datetime import datetime, timezone

          import requests

          RENDER_URL = (
              "https://x-video-downloader-api.onrender.com"
              "/send-media-and-send"
          )

          API_KEY = os.environ["RENDER_API_KEY"]

          BACKUP_HISTORY = "history.test.backup.json"
          REAL_HISTORY = "history.json"

          try:

              with open(
                  "selected_candidates.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  candidates = json.load(f)

              print(
                  f"Selected candidates: {len(candidates)}"
              )

              if not candidates:
                  print(
                      "No selected candidates."
                  )
                  sys.exit(1)

              candidate = candidates[0]

              media_url = candidate.get(
                  "media_url"
              )

              caption = candidate.get(
                  "caption",
                  ""
              ).strip()

              if not media_url:
                  print(
                      "First candidate has no media_url."
                  )
                  sys.exit(1)

              if caption:
                  final_caption = (
                      caption
                      + "\n\n"
                      + "@utcutie"
                  )
              else:
                  final_caption = "@utcutie"

              # Final Telegram caption safety limit.
              if len(final_caption) > 1024:

                  final_caption = (
                      final_caption[:1018].rstrip()
                      + "\n\n"
                      + "@utcutie"
                  )

              print("")
              print("=" * 70)
              print("AUTOMATED END-TO-END TEST")
              print("=" * 70)

              print(
                  f"Media URL: {media_url}"
              )

              print(
                  f"Duration: "
                  f"{candidate.get('duration')}"
              )

              print(
                  f"File size: "
                  f"{candidate.get('file_size')}"
              )

              print(
                  f"Caption length: "
                  f"{len(final_caption)}"
              )

              print(
                  f"Caption:\n{final_caption}"
              )

              print("")
              print(
                  "Sending to Render..."
              )

              try:

                  response = requests.get(
                      RENDER_URL,
                      params={
                          "media_url": media_url,
                          "caption": final_caption
                      },
                      headers={
                          "x-api-key": API_KEY
                      },
                      timeout=360
                  )

              except Exception as exc:

                  print(
                      f"Request failed: {exc}"
                  )

                  sys.exit(1)

              print(
                  f"HTTP status: "
                  f"{response.status_code}"
              )

              print(
                  f"Render response: "
                  f"{response.text}"
              )

              if not response.ok:

                  print(
                      "END-TO-END TEST FAILED."
                  )

                  sys.exit(1)

              try:

                  result = response.json()

              except Exception:

                  print(
                      "Render returned invalid JSON."
                  )

                  sys.exit(1)

              if not result.get(
                  "telegram_sent"
              ):

                  print(
                      "Telegram upload was not confirmed."
                  )

                  sys.exit(1)

              message_id = result.get(
                  "telegram_message_id"
              )

              print("")
              print("=" * 70)
              print(
                  "END-TO-END TEST SUCCESS"
              )
              print("=" * 70)

              print(
                  f"Telegram message ID: "
                  f"{message_id}"
              )

              print(
                  f"Duration: "
                  f"{result.get('duration')}"
              )

              print(
                  f"File size: "
                  f"{result.get('file_size')}"
              )

              print("")
              print(
                  "This was an ISOLATED TEST."
              )

              print(
                  "The publication will NOT be added "
                  "to real history."
              )

          finally:

              # --------------------------------------------------
              # ALWAYS restore the real publication history.
              # --------------------------------------------------

              if os.path.exists(
                  BACKUP_HISTORY
              ):

                  shutil.copyfile(
                      BACKUP_HISTORY,
                      REAL_HISTORY
                  )

                  print("")
                  print(
                      "Real history.json restored."
                  )

              else:

                  print(
                      "WARNING: history backup was not found."
                  )

          PY


      # --------------------------------------------------
      # 7. Save discovery results only
      #
      # IMPORTANT:
      # history.json is deliberately NOT committed here.
      # --------------------------------------------------

      - name: Save test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f history.test.backup.json

          git add \
            mastodon_candidates.json \
            validated_candidates.json \
            selected_candidates.json

          git diff --cached --quiet || \
            git commit -m "Update UTCutie discovery test results"

          git push
